apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: tax-calculator-pipeline
spec:
  workspaces:
    - name: shared-workspace
  params:
    - name: image-url
      type: string
  tasks:
    - name: test-app
      taskRef:
        name: test
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: build-app
      taskRef:
        name: build-image
      runAfter:
        - test-app
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: $(params.image-url)
